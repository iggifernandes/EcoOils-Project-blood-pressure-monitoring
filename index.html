<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Pressure Monitoring · Mentari Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="combobox.css">
<style>
  :root{
    --navy:#4A1111;
    --navy-2:#6B1A1A;
    --steel:#8C2424;
    --steel-line:#A33434;
    --amber:#F2C230;
    --amber-dim:#8a6414;
    --green:#2E9E5B;
    --green-glow:rgba(46,158,91,0.35);
    --red:#D8453A;
    --paper:#F3F5F7;
    --card:#FFFFFF;
    --ink:#101820;
    --muted:#5B6B7C;
    --hair:#E2E7EC;
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
    background:
      linear-gradient(180deg, rgba(11,24,40,0.90) 0%, rgba(14,33,56,0.86) 40%, rgba(243,245,247,0.97) 78%, var(--paper) 100%),
      url("https://upload.wikimedia.org/wikipedia/commons/7/7d/Duqm_Refinery.jpg") center 30%/cover fixed;
    background-color:var(--paper);
  }
  @media (max-width:820px){
    body{ background-attachment:scroll; }
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header.top{
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 65%,var(--steel) 100%);
    color:#EAF0F6;
    padding:24px clamp(14px,4vw,56px) 32px;
    position:relative;
    overflow:hidden;
  }
  @media (max-width:480px){ header.top{padding:18px 14px 26px;} }
  header.top::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(242,194,48,0.06) 0px, rgba(242,194,48,0.06) 1px, transparent 1px, transparent 64px);
    pointer-events:none;
  }
  .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; position:relative; z-index:1;}
  .brand-eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--amber); margin:0 0 8px;
  }
  h1.title{
    font-family:var(--font-display); font-weight:700; font-size:clamp(19px,2.6vw,26px);
    margin:6px 0 0; letter-spacing:.01em; line-height:1.15;
  }
  .brand-sub{color:#A9BBCC; font-size:13px; margin-top:0;}

  /* stat strip */
  .stats{
    display:grid; grid-template-columns:1.3fr repeat(3,1fr); gap:14px;
    margin-top:28px; position:relative; z-index:1;
  }
  @media (max-width:820px){ .stats{grid-template-columns:1fr 1fr;} }
  .stat-card{
    background:rgba(255,255,255,0.045); border:1px solid var(--steel-line); border-radius:12px;
    padding:16px 18px;
  }
  .stat-label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:#8FA3B8; margin:0 0 8px;}
  .stat-value{font-family:var(--font-display); font-size:28px; font-weight:600; color:#EAF0F6;}
  .stat-value small{font-family:var(--font-body); font-size:13px; color:#8FA3B8; font-weight:400;}
  @media (max-width:480px){
    .stat-value{font-size:22px;}
    .stat-card{padding:12px 14px;}
  }

  /* readout: hero signature element */
  .readout{
    background:#1A0707; border:1px solid #5C1E1E; border-radius:12px; padding:16px 18px;
    display:flex; flex-direction:column; justify-content:space-between; gap:10px;
    box-shadow:inset 0 0 24px rgba(0,0,0,0.35);
  }
  .readout .stat-label{color:#5F8A6D;}
  .readout-display{
    font-family:var(--font-mono); font-weight:700; font-size:40px; color:var(--green);
    text-shadow:0 0 14px var(--green-glow), 0 0 2px var(--green-glow);
    letter-spacing:.02em; line-height:1;
  }
  @media (max-width:480px){ .readout-display{font-size:30px;} }
  .readout-caption{font-size:11.5px; color:#6E8B9E; font-family:var(--font-mono);}
  .blink-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green); margin-right:6px; box-shadow:0 0 6px var(--green); animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- Layout ---------- */
  main{max-width:1180px; margin:-18px auto 60px; padding:0 clamp(12px,4vw,32px); position:relative; z-index:2;}
  .card{
    background:var(--card); border:1px solid var(--hair); border-radius:14px;
    box-shadow:0 1px 2px rgba(16,24,32,0.04), 0 12px 28px -18px rgba(16,24,32,0.18);
    padding:20px clamp(14px,3vw,30px);
    margin-bottom:18px;
  }
  @media (max-width:480px){ main{margin-top:-12px;} .card{border-radius:12px; padding:16px 14px;} }
  .card h2{
    font-family:var(--font-display); font-size:17px; font-weight:600; margin:0 0 4px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .card h2 .num{
    font-family:var(--font-mono); font-size:12px; color:var(--amber-dim); background:#FFF4DC;
    border-radius:6px; padding:2px 7px;
  }
  .card .sub{color:var(--muted); font-size:13.5px; margin:0 0 20px;}

  /* ---------- Form ---------- */
  form#logForm{display:grid; grid-template-columns:repeat(3,1fr); gap:16px 18px;}
  @media (max-width:760px){ form#logForm{grid-template-columns:1fr 1fr;} }
  @media (max-width:520px){ form#logForm{grid-template-columns:1fr;} }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.span2{grid-column:span 2;}
  .field.span3{grid-column:1/-1;}
  @media (max-width:520px){ .field.span2, .field.span3{grid-column:1/-1;} }
  label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  input[type=text], input[type=date], input[type=time], textarea, select{
    font-family:var(--font-body); font-size:14.5px; padding:10px 12px; border:1.5px solid var(--hair);
    border-radius:8px; background:#FBFCFD; color:var(--ink); transition:border-color .15s, background .15s;
  }
  input:focus, textarea:focus, select:focus{
    outline:none; border-color:var(--steel); background:#fff;
  }
  .outcome-toggle{display:flex; gap:8px;}
  .outcome-toggle input{position:absolute; opacity:0; width:0; height:0;}
  .outcome-toggle label{
    flex:1; text-align:center; padding:10px 6px; border:1.5px solid var(--hair); border-radius:8px;
    cursor:pointer; font-size:11px; font-weight:700; letter-spacing:.02em; color:var(--muted); text-transform:none;
    transition:all .12s;
  }
  .outcome-toggle input:checked + label{border-color:transparent; color:#fff;}
  .outcome-toggle input[value="Go"]:checked + label{background:var(--green);}
  .outcome-toggle input[value="No Go"]:checked + label{background:var(--red);}

  .form-actions{grid-column:1/-1; display:flex; align-items:center; gap:14px; margin-top:4px; flex-wrap:wrap;}
  button.primary{
    font-family:var(--font-body); font-weight:700; font-size:14.5px; color:#0E2138; background:var(--amber);
    border:none; border-radius:9px; padding:12px 22px; cursor:pointer; letter-spacing:.01em;
    transition:transform .1s, box-shadow .15s;
  }
  button.primary:hover{box-shadow:0 8px 18px -8px rgba(242,194,48,0.55); transform:translateY(-1px);}
  button.primary:active{transform:translateY(0);}
  button.primary:disabled{opacity:.55; cursor:not-allowed; box-shadow:none; transform:none;}
  #formMsg{font-size:13px; color:var(--muted);}
  #formMsg.ok{color:var(--green); font-weight:600;}
  #formMsg.err{color:var(--red); font-weight:600;}

  footer{text-align:center; color:var(--muted); font-size:12px; padding:20px; font-family:var(--font-mono);}

  /* ---------- Contractor chart ---------- */
  .contractor-chart{display:flex; flex-direction:column; gap:10px;}
  .bar-row{display:grid; grid-template-columns:110px 1fr 32px; align-items:center; gap:10px;}
  @media (max-width:600px){ .bar-row{grid-template-columns:88px 1fr 28px;} }
  .bar-label{font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{background:#EEF2F6; border-radius:4px; height:12px; overflow:hidden;}
  .bar-fill{
    height:100%; border-radius:4px; background:var(--amber);
    transition:width .4s ease; min-width:3px;
  }
  .bar-count{font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--steel); text-align:right;}
  .chart-empty{color:var(--muted); font-size:13.5px; padding:10px 0;}

  /* ---------- Brand / logo ---------- */
  .brand-block{display:flex; flex-direction:column; align-items:flex-start; gap:10px;}
  .logo-mark{height:54px; width:auto; display:block; flex:0 0 auto;}
  @media (max-width:520px){ .logo-mark{height:40px;} }

  /* ---------- Language toggle ---------- */
  .lang-toggle{
    display:flex; border:1px solid var(--steel-line); border-radius:9px; overflow:hidden;
    background:rgba(255,255,255,0.04); flex:0 0 auto;
  }
  .lang-btn{
    font-family:var(--font-mono); font-size:12px; font-weight:700; letter-spacing:.04em;
    color:#8FA3B8; background:transparent; border:none; padding:8px 14px; cursor:pointer;
  }
  .lang-btn.active{background:var(--amber); color:#0E2138;}
  .lang-btn:not(.active):hover{color:#EAF0F6;}

  /* ---------- Add-project control ---------- */
  .add-inline{display:flex; gap:8px;}
  .add-inline select{flex:1;}
  .btn-add{
    font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--steel);
    background:#EAF0F6; border:1.5px solid var(--hair); border-radius:8px; padding:0 14px; cursor:pointer;
    white-space:nowrap;
  }
  .btn-add:hover{border-color:var(--steel);}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand-block">
      <img class="logo-mark" src="logo.png" alt="EcoOils Mentari">
      <div>
        <p class="brand-eyebrow" data-i18n="eyebrow">PT EcoOils Jaya Indonesia · HSSE</p>
        <p class="brand-sub" data-i18n="subtitle">Mentari Project · Sei Mangkei</p>
        <h1 class="title" data-i18n="title">Blood Pressure Monitoring</h1>
      </div>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" class="lang-btn active" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="bi">BI</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card readout">
      <p class="stat-label"><span class="blink-dot"></span><span data-i18n="livePassRate">Go rate</span></p>
      <div class="readout-display" id="readoutPassRate">--.-%</div>
      <p class="readout-caption" id="readoutCaption"></p>
    </div>
    <div class="stat-card">
      <p class="stat-label" data-i18n="totalTests">Total tests logged</p>
      <div class="stat-value" id="statTotal">–</div>
    </div>
    <div class="stat-card">
      <p class="stat-label" data-i18n="failsRefused">No-Go / flagged</p>
      <div class="stat-value" id="statFails">–</div>
    </div>
    <div class="stat-card">
      <p class="stat-label" data-i18n="loggedMonth">Logged this month</p>
      <div class="stat-value" id="statMonth">–</div>
    </div>
  </div>
</header>

<main>

  <section class="card">
    <h2><span data-i18n="monthByContractor">This month by contractor</span> <span class="num" id="monthTotalBadge">0</span></h2>
    <p class="sub" id="monthChartSub"></p>
    <div id="contractorChart" class="contractor-chart"></div>
  </section>

  <section class="card">
    <h2><span class="num">NEW</span> <span data-i18n="logTest">Log a check-up</span></h2>

    <form id="logForm">
      <div class="field">
        <label data-i18n="fDate">Date *</label>
        <input type="date" id="f_date" required>
      </div>
      <div class="field">
        <label data-i18n="fTime">Time *</label>
        <input type="time" id="f_time" required>
      </div>
      <div class="field">
        <label data-i18n="fEmployee">Name *</label>
        <input type="text" id="f_employee" data-i18n-placeholder="fullName" placeholder="Full name" required>
      </div>
      <div class="field">
        <label data-i18n="fContractor">Contractor *</label>
        <select id="f_contractor" required>
          <option value="" disabled selected data-i18n="selectContractor">Select contractor…</option>
          <option value="PT PBS">PT PBS</option>
          <option value="PT GSB">PT GSB</option>
          <option value="PT KKS">PT KKS</option>
          <option value="PT WEN">PT WEN</option>
          <option value="__other__" data-i18n="other">Other…</option>
        </select>
        <input type="text" id="f_contractorOther" data-i18n-placeholder="contractorNamePlaceholder" placeholder="Contractor name" style="display:none; margin-top:6px;">
      </div>

      <div class="field">
        <label data-i18n="fPosition">Position *</label>
        <div class="combobox">
          <input type="text" id="f_position_search" data-i18n-placeholder="positionPlaceholder" placeholder="Search position…" autocomplete="off" required>
          <input type="hidden" id="f_position">
          <ul class="combobox-list" id="f_position_list" role="listbox"></ul>
          <span class="combobox-error" id="f_position_error"></span>
        </div>
      </div>
      <div class="field">
        <label data-i18n="fCraftDiscipline">Craft / Discipline *</label>
        <div class="combobox">
          <input type="text" id="f_craftDiscipline_search" data-i18n-placeholder="craftDisciplinePlaceholder" placeholder="Search craft / discipline…" autocomplete="off" required>
          <input type="hidden" id="f_craftDiscipline">
          <ul class="combobox-list" id="f_craftDiscipline_list" role="listbox"></ul>
          <span class="combobox-error" id="f_craftDiscipline_error"></span>
        </div>
      </div>
      <div class="field">
        <label data-i18n="fEmployeeId">Age *</label>
        <input type="number" id="f_employeeId" min="15" max="80" placeholder="e.g. 29" required>
      </div>
      <div class="field">
        <label data-i18n="fResult">Tension (BP) *</label>
        <input type="text" id="f_result" placeholder="e.g. 120/80" required>
      </div>

      <div class="field">
        <label data-i18n="fCraft">Pulse *</label>
        <input type="text" id="f_craft" placeholder="e.g. 78" required>
      </div>
      <div class="field">
        <label data-i18n="fTesterPosition">Temp (°C) *</label>
        <input type="text" id="f_testerPosition" placeholder="e.g. 36.5" required>
      </div>
      <div class="field">
        <label data-i18n="fTester">Physical *</label>
        <input type="text" id="f_tester" placeholder="e.g. Good" required>
      </div>

      <div class="field span3">
        <label data-i18n="fOutcome">Go / No-Go *</label>
        <div class="outcome-toggle">
          <input type="radio" name="outcome" id="o_pass" value="Go" checked><label for="o_pass" data-i18n="pass">Go</label>
          <input type="radio" name="outcome" id="o_fail" value="No Go"><label for="o_fail" data-i18n="fail">No Go</label>
        </div>
      </div>

      <div class="field">
        <label data-i18n="fEmployeeId2">Remarks *</label>
        <select id="f_remarks" required>
          <option value="" disabled selected data-i18n="selectRemarks">Select remarks…</option>
          <option value="Normal" data-i18n="remarkNormal">Normal</option>
          <option value="High" data-i18n="remarkHigh">High</option>
          <option value="Low" data-i18n="remarkLow">Low</option>
        </select>
      </div>
      <div class="field span2">
        <label data-i18n="fNotes">Recommendation action</label>
        <input type="text" id="f_notes" data-i18n-placeholder="optional" placeholder="e.g. Minum yang cukup, Istirahat sejenak">
      </div>

      <div class="field">
        <label data-i18n="fCheckedBy">Checked by *</label>
        <input type="text" id="f_checkedBy" data-i18n-placeholder="fullName" placeholder="Full name" required>
      </div>
      <div class="field">
        <label data-i18n="fCheckedByPosition">Checked by position *</label>
        <input type="text" id="f_checkedByPosition" placeholder="e.g. Paramedic/Hiperkes" required>
      </div>
      <div class="field">
        <label data-i18n="fApprovedBy">Approved by</label>
        <input type="text" id="f_approvedBy" data-i18n-placeholder="optional" placeholder="Optional">
      </div>

      <div class="form-actions">
        <button type="submit" class="primary" id="submitBtn" data-i18n="logRecordBtn">Log check-up</button>
        <span id="formMsg"></span>
      </div>
    </form>

  </section>

</main>

<script src="personnel-lists.js"></script>
<script>
(function(){
  "use strict";

  // ── Paste your Google Apps Script Web App /exec URL here. All data (past
  //    and new) lives in the Google Sheet behind this URL — nothing is
  //    stored in the page itself. See the accompanying Apps Script code
  //    (Code.gs) for the doGet / doPost handlers this expects.
  const SHEETS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbytAJat3KB9WqhixDyEJXE-cORp_WN7p6_nK4X_fLcLZiRKqDmZFCWA9qJ-i7JZ_zSz/exec";

  // Same spreadsheet and deployment as the Alcohol Test page — this just
  // points at a different tab within it, via the "sheet" param/field that
  // Code.gs's doGet/doPost route on.
  const BP_SHEET_NAME = "BloodPressure";

  // ── EN / BI translations for on-page labels ──────────────────────────
  const I18N = {
    en: {
      eyebrow: "PT EcoOils Jaya Indonesia · HSSE",
      title: "Blood Pressure Monitoring",
      subtitle: "Mentari Project · Sei Mangkei",
      livePassRate: "Go rate",
      totalTests: "Total check-ups logged",
      failsRefused: "No-Go / flagged",
      loggedMonth: "Logged this month",
      logTest: "Log a check-up",
      monthByContractor: "This month by contractor",
      testsThisMonth: "check-up(s) this month",
      noDataMonth: "No check-ups logged yet this month.",
      fDate: "Date *", fTime: "Time *",
      fContractor: "Contractor *", selectContractor: "Select contractor…",
      other: "Other…", contractorNamePlaceholder: "Contractor name",
      fPosition: "Position *", positionPlaceholder: "Search position…",
      fCraftDiscipline: "Craft / Discipline *", craftDisciplinePlaceholder: "Search craft / discipline…",
      pickFromList: "must be selected from the list.",
      fEmployee: "Name *", fullName: "Full name",
      fEmployeeId: "Age *",
      fCraft: "Pulse *",
      fResult: "Tension (BP) *",
      fOutcome: "Go / No-Go *", pass: "Go", fail: "No Go",
      fTester: "Physical *",
      fTesterPosition: "Temp (°C) *",
      fEmployeeId2: "Remarks *", selectRemarks: "Select remarks…",
      remarkNormal: "Normal", remarkHigh: "High", remarkLow: "Low",
      fNotes: "Recommendation action", optional: "Optional",
      fCheckedBy: "Checked by *",
      fCheckedByPosition: "Checked by position *",
      fApprovedBy: "Approved by",
      logRecordBtn: "Log check-up",
      savingSheets: "Saving to Google Sheets…", loggedOk: "Logged to Google Sheets ✓",
      unreachable: "Couldn't reach Google Sheets — nothing was saved.",
      setUrlFirst: "Set SHEETS_WEBHOOK_URL first — there's nowhere to save this yet.",
      testsOnRecord: "check-ups on record",
    },
    bi: {
      eyebrow: "PT EcoOils Jaya Indonesia · HSSE",
      title: "Pemantauan Tekanan Darah",
      subtitle: "Proyek Mentari · Sei Mangkei",
      livePassRate: "Tingkat Go",
      totalTests: "Total pemeriksaan tercatat",
      failsRefused: "No-Go / ditandai",
      loggedMonth: "Tercatat bulan ini",
      logTest: "Catat pemeriksaan",
      monthByContractor: "Bulan ini per kontraktor",
      testsThisMonth: "pemeriksaan bulan ini",
      noDataMonth: "Belum ada pemeriksaan tercatat bulan ini.",
      fDate: "Tanggal *", fTime: "Waktu *",
      fContractor: "Kontraktor *", selectContractor: "Pilih kontraktor…",
      other: "Lainnya…", contractorNamePlaceholder: "Nama kontraktor",
      fPosition: "Posisi *", positionPlaceholder: "Cari posisi…",
      fCraftDiscipline: "Keahlian / Disiplin *", craftDisciplinePlaceholder: "Cari keahlian / disiplin…",
      pickFromList: "harus dipilih dari daftar.",
      fEmployee: "Nama *", fullName: "Nama lengkap",
      fEmployeeId: "Usia *",
      fCraft: "Nadi *",
      fResult: "Tensi (BP) *",
      fOutcome: "Go / No-Go *", pass: "Go", fail: "No Go",
      fTester: "Fisik *",
      fTesterPosition: "Suhu (°C) *",
      fEmployeeId2: "Keterangan *", selectRemarks: "Pilih keterangan…",
      remarkNormal: "Normal", remarkHigh: "Tinggi", remarkLow: "Rendah",
      fNotes: "Tindakan rekomendasi", optional: "Opsional",
      fCheckedBy: "Diperiksa oleh *",
      fCheckedByPosition: "Jabatan pemeriksa *",
      fApprovedBy: "Disetujui oleh",
      logRecordBtn: "Catat pemeriksaan",
      savingSheets: "Menyimpan ke Google Sheets…", loggedOk: "Tercatat ke Google Sheets ✓",
      unreachable: "Tidak dapat terhubung ke Google Sheets — data tidak tersimpan.",
      setUrlFirst: "Atur SHEETS_WEBHOOK_URL terlebih dahulu — belum ada tempat untuk menyimpan.",
      testsOnRecord: "pemeriksaan tercatat",
    }
  };
  let currentLang = "en";
  function T(){ return I18N[currentLang]; }

  function applyLang(){
    const dict = T();
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.dataset.i18n;
      if(dict[key] !== undefined) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
      const key = el.dataset.i18nPlaceholder;
      if(dict[key] !== undefined) el.placeholder = dict[key];
    });
    document.querySelectorAll('.lang-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.lang===currentLang);
    });
    updateStats();
  }

  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentLang = btn.dataset.lang;
      applyLang();
    });
  });

  let records = [];

  // No historical Blood Pressure data exists yet (unlike the Alcohol Test
  // page, which had 1,089 prior records to seed from) — so this baseline
  // starts at zero and the real numbers simply come from the Sheet once
  // SHEETS_WEBHOOK_URL is connected and check-ups start getting logged.
  const BASELINE_STATS = { total: 0, fails: 0, thisMonth: 0 };

  // "thisMonth" and the breakdown below are a snapshot of August 2026 — they
  // only apply while the page is actually being viewed in that month. Once
  // the calendar rolls to a new month, the fallback correctly shows 0 / no
  // data (rather than freezing on stale numbers) until SHEETS_WEBHOOK_URL is
  // connected and live per-record data takes over for real.
  const BASELINE_MONTH_CONTRACTORS = {};

  // Groups check-ups by contractor for the monthly chart. The dropdown gives
  // PT PBS / PT GSB / PT KKS / PT WEN; "Other" names are typed in, so
  // spelling variants of the known four are folded into one bar.
  function normalizeContractor(c){
    const u = (c||"").toUpperCase();
    if(!u.trim()) return "Unspecified";
    if(u.includes("KKS")) return "PT KKS";
    if(u.includes("PBS")) return "PT PBS";
    if(u.includes("GSB")) return "PT GSB";
    if(u.includes("WEN")) return "PT WEN";
    return c.trim();
  }

  function outcomeClass(o){
    if(o==="Pass") return "pass";
    if(o==="Fail") return "fail";
    return "na";
  }

  function renderBars(counts, total){
    const container = document.getElementById('contractorChart');
    document.getElementById('monthTotalBadge').textContent = total.toLocaleString();
    document.getElementById('monthChartSub').textContent = total
      ? `${total} ${T().testsThisMonth}`
      : T().noDataMonth;

    if(total===0){
      container.innerHTML = `<div class="chart-empty">${T().noDataMonth}</div>`;
      return;
    }

    const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const max = entries[0][1];

    container.innerHTML = entries.map(([name,count])=>`
      <div class="bar-row">
        <div class="bar-label" title="${name}">${name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(count/max)*100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join("");
  }

  function renderContractorChart(){
    const now = new Date();
    const ym = now.toISOString().slice(0,7);
    const monthRecords = records.filter(r=>(r.date||"").slice(0,7)===ym);

    const counts = {};
    monthRecords.forEach(r=>{
      const c = normalizeContractor(r.contractor);
      counts[c] = (counts[c]||0) + 1;
    });

    renderBars(counts, monthRecords.length);
  }

  function updateStats(){
    const total = records.length;
    const fails = records.filter(r=>r.goNoGo!=="Go").length;
    const passRate = total ? (((total-fails)/total)*100).toFixed(1) : "0.0";
    const now = new Date();
    const ym = now.toISOString().slice(0,7);
    const thisMonth = records.filter(r=>(r.date||"").slice(0,7)===ym).length;

    document.getElementById('statTotal').textContent = total.toLocaleString();
    document.getElementById('statFails').textContent = fails.toLocaleString();
    document.getElementById('statMonth').textContent = thisMonth.toLocaleString();
    document.getElementById('readoutPassRate').textContent = total ? passRate + "%" : "--.-%";
    document.getElementById('readoutCaption').textContent = total ? (total + " " + T().testsOnRecord) : "";
    document.getElementById('readoutPassRate').style.color = fails===0 && total>0 ? "var(--green)" : "var(--amber)";
    renderContractorChart();
  }

  function renderBaselineStats(){
    const { total, fails, thisMonth } = BASELINE_STATS;
    const passRate = total ? (((total-fails)/total)*100).toFixed(1) : "0.0";

    document.getElementById('statTotal').textContent = total.toLocaleString();
    document.getElementById('statFails').textContent = fails.toLocaleString();
    document.getElementById('statMonth').textContent = thisMonth.toLocaleString();
    document.getElementById('readoutPassRate').textContent = total ? passRate + "%" : "--.-%";
    document.getElementById('readoutCaption').textContent = total ? (total + " " + T().testsOnRecord) : "";
    document.getElementById('readoutPassRate').style.color = fails===0 && total>0 ? "var(--green)" : "var(--amber)";
    renderBars(BASELINE_MONTH_CONTRACTORS, thisMonth);
  }

  async function loadFromSheets(){
    if(!SHEETS_WEBHOOK_URL){
      return;
    }
    try{
      const url = SHEETS_WEBHOOK_URL + "?sheet=" + encodeURIComponent(BP_SHEET_NAME);
      const res = await fetch(url, {method:"GET"});
      const json = await res.json();
      records = Array.isArray(json) ? json : (json.records || []);
    }catch(err){
      // Silent fail for end users — check SHEETS_WEBHOOK_URL / deployment settings if this happens.
    }
    updateStats();
  }

  document.getElementById('f_contractor').addEventListener('change', function(){
    document.getElementById('f_contractorOther').style.display = this.value==="__other__" ? "block" : "none";
  });

  // ── Position / Craft searchable dropdowns (personnel-lists.js)
  const positionWidget = initSearchableSelect({
    inputId: "f_position_search", hiddenId: "f_position", listId: "f_position_list",
    options: POSITION_LIST, errorId: "f_position_error"
  });
  const craftWidget = initSearchableSelect({
    inputId: "f_craftDiscipline_search", hiddenId: "f_craftDiscipline", listId: "f_craftDiscipline_list",
    options: CRAFT_LIST, errorId: "f_craftDiscipline_error"
  });

  // ── Form submit
  const form = document.getElementById('logForm');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msg = document.getElementById('formMsg');
    const submitBtn = document.getElementById('submitBtn');
    const outcomeEl = form.querySelector('input[name="outcome"]:checked');

    if(!SHEETS_WEBHOOK_URL){
      msg.textContent = T().setUrlFirst;
      msg.className = "err";
      return;
    }

    const positionOk = positionWidget.validate(T().fPosition.replace(" *","") + " " + T().pickFromList);
    const craftOk = craftWidget.validate(T().fCraftDiscipline.replace(" *","") + " " + T().pickFromList);
    if(!positionOk || !craftOk){
      msg.textContent = "";
      return;
    }

    const contractorSel = document.getElementById('f_contractor').value;
    const contractor = contractorSel==="__other__" ? document.getElementById('f_contractorOther').value.trim() : contractorSel;

    // Field names here match the BloodPressure tab's header row exactly —
    // doPost in Code.gs builds the row generically from these keys.
    const rec = {
      sheet: BP_SHEET_NAME,
      date: document.getElementById('f_date').value,
      time: document.getElementById('f_time').value,
      name: document.getElementById('f_employee').value.trim(),
      contractor: contractor,
      position: document.getElementById('f_position').value,
      craftDiscipline: document.getElementById('f_craftDiscipline').value,
      age: document.getElementById('f_employeeId').value.trim(),
      tension: document.getElementById('f_result').value.trim(),
      puls: document.getElementById('f_craft').value.trim(),
      temp: document.getElementById('f_testerPosition').value.trim(),
      physical: document.getElementById('f_tester').value.trim(),
      goNoGo: outcomeEl ? outcomeEl.value : "Go",
      remarks: document.getElementById('f_remarks').value,
      recommendation: document.getElementById('f_notes').value.trim(),
      checkedBy: document.getElementById('f_checkedBy').value.trim(),
      checkedByPosition: document.getElementById('f_checkedByPosition').value.trim(),
      approvedBy: document.getElementById('f_approvedBy').value.trim(),
    };

    submitBtn.disabled = true;
    msg.textContent = T().savingSheets;
    msg.className = "";

    try{
      await fetch(SHEETS_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(rec)
      });
      msg.textContent = T().loggedOk;
      msg.className = "ok";
      form.reset();
      document.getElementById('o_pass').checked = true;
      document.getElementById('f_contractorOther').style.display = "none";
      positionWidget.reset();
      craftWidget.reset();
      await loadFromSheets();
    }catch(err){
      msg.textContent = T().unreachable;
      msg.className = "err";
    }finally{
      submitBtn.disabled = false;
    }
  });

  // ── Init
  renderBaselineStats();
  loadFromSheets();
})();
</script>
</body>
</html>
